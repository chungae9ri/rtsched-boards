[target.thumbv8m.main-none-eabihf]
#  probe-rs gdb --chip LPC55S69JBD100 --protocol swd
runner = "probe-rs download --chip LPC55S69JBD100 --protocol swd"
rustflags = [
  "-C", "link-arg=-Tlink.x",      # Use the linker script generated by cortex-m-rt
  "-C", "linker=rust-lld",        # Use the LLD linker instead of 'cc'
  "-C", "link-arg=-Map=target/thumbv8m.main-none-eabihf/debug/lpc55s69.map", # Generate a map file for debugging
  "-C", "link-arg=--gc-sections", # Remove unused code and data
  "-C", "link-arg=--print-memory-usage", # Print memory usage after linking
  "-C", "link-arg=--defsym=__stack_size=4096", # Set the stack size to 4 KB
  "-C", "link-arg=--defsym=__heap_size=8192",  # Set the heap size to 8 KB
]

[env]
RUST_LOG = "probe_rs=warn"

[build]
target = "thumbv8m.main-none-eabihf"

[alias]
test-host = "test -p rtsched --target x86_64-unknown-linux-gnu"

