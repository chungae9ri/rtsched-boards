name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  host-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Pull submodules
      run: git config --global url."https://github.com/".insteadOf "git@github.com:" && git submodule update --init --recursive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Run host tests
      run: cargo test --target x86_64-unknown-linux-gnu

  embedded-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Pull submodules
      run: git config --global url."https://github.com/".insteadOf "git@github.com:" && git submodule update --init --recursive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install embedded Rust target
      run: rustup target add thumbv8m.main-none-eabihf
    - name: Run embedded check
      run: cargo check --target thumbv8m.main-none-eabihf
